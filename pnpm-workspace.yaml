# 包的发现范围。两层是 dsh 自己的约定（它的根 package.json 里就是 packages/*/*），
# 我们镜像它：packages/<组>/<包>，组名见 docs/PLAN.md §6.2 的文件树。
packages:
  - packages/*/*

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.1.5-rc.1'
  - '@deepseek-ai/dsh-brand@0.1.5-rc.1'
  - '@deepseek-ai/dsh-code-runtime@0.1.5-rc.1'
  - '@deepseek-ai/dsh-invariants@0.1.5-rc.1'
  - '@deepseek-ai/dsh-llm@0.1.5-rc.1'
  - '@deepseek-ai/dsh-scope@0.1.5-rc.1'
  - '@deepseek-ai/dsh-session-projection@0.1.5-rc.1'
  - '@deepseek-ai/dsh-session@0.1.5-rc.1'
  - '@deepseek-ai/dsh-system-prompt@0.1.5-rc.1'
  - '@deepseek-ai/dsh-timeout@0.1.5-rc.1'
  - '@deepseek-ai/dsh-tools@0.1.5-rc.1'
  - '@deepseek-ai/dsh-typert-protocol@0.1.5-rc.1'
  - '@deepseek-ai/dsh-user-approval@0.1.5-rc.1'
  - '@deepseek-ai/dsh-util-crypto@0.1.5-rc.1'
  - '@deepseek-ai/dsh-util-values@0.1.5-rc.1'

# pnpm 10+ 默认 strictDepBuilds：**任何依赖带 install/postinstall 脚本，而没有在这里
# 逐个登记，就是硬安装错误**（不是警告，也不是静默跳过）。默认拒绝、审过才放行。
#
# 这条策略正好是我们要的。dsh 0.1.3-alpha.2 的 fs-ext 是个现场编译的原生模块——
# 将来真要升级时，它会在这里当场变红并要求我们表态，而不是偷偷编译成功或偷偷跳过
# 留下一个运行期才炸的坑（facts.md §8.0 记的就是那个坑）。
#
# 当前依赖树（68 个包，全是 typescript / vitest / @types/node 的闭包）**没有任何一个
# 带构建脚本**，所以这里是空的。allowBuilds 是一份"我审过了"的清单，不预先填。
# 将来第一个真需要的很可能是 node-pty 或 better-sqlite3，到时逐个写理由。
# allowBuilds:
#   <包名>: true   # 为什么必须放行

# @deepseek-ai/* 的整套精确钉版将放在这里的 overrides 段（**不是** package.json 的
# pnpm 段——pnpm 10 起这些设置搬到了本文件；dsh 自己也写在这里）。
#
# ⚠️ **overrides 的键不支持通配，而且写了通配是「静默无效」**（2026-09-08 实测：
# `'@types/*': '22.20.0'` 对 @types/semver 完全没作用，不报错也不警告）。
# 所以 0.3 必须用脚本从安装树生成**逐包**的 overrides 表，绝不能写 '@deepseek-ai/*'
# 然后以为钉住了 223 个包——那样实际一个都没钉住，而且看不出来。
# 抓这种静默失效的是 packages/host/compat/contract/pin.test.ts。见 EXECUTION.md 台账 B4。
#
# 下面这张表从真实安装树导出（不是手抄）。dsh 系全部同一精确版本；Cordis 系是独立
# 版本线，各钉各的（facts.md §1）。升级 dsh 时整张表一起换。
overrides:
  '@deepseek-ai/cordis': '4.0.2'
  '@deepseek-ai/cordis-plugin-include': '1.0.7'
  '@deepseek-ai/cosmokit': '1.8.3'
  '@deepseek-ai/dsh-agent': '0.1.5-rc.1'
  '@deepseek-ai/dsh-brand': '0.1.5-rc.1'
  '@deepseek-ai/dsh-code-runtime': '0.1.5-rc.1'
  '@deepseek-ai/dsh-invariants': '0.1.5-rc.1'
  '@deepseek-ai/dsh-llm': '0.1.5-rc.1'
  '@deepseek-ai/dsh-scope': '0.1.5-rc.1'
  '@deepseek-ai/dsh-session': '0.1.5-rc.1'
  '@deepseek-ai/dsh-session-projection': '0.1.5-rc.1'
  '@deepseek-ai/dsh-system-prompt': '0.1.5-rc.1'
  '@deepseek-ai/dsh-timeout': '0.1.5-rc.1'
  '@deepseek-ai/dsh-tools': '0.1.5-rc.1'
  '@deepseek-ai/dsh-typert-protocol': '0.1.5-rc.1'
  '@deepseek-ai/dsh-user-approval': '0.1.5-rc.1'
  '@deepseek-ai/dsh-util-crypto': '0.1.5-rc.1'
  '@deepseek-ai/dsh-util-values': '0.1.5-rc.1'
  '@deepseek-ai/schemastery': '3.18.2'
