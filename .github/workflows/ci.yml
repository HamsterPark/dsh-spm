name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支有新提交时取消上一轮，避免重复占用 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows 从 Phase 0 就在矩阵里，不是等到出问题才加（PLAN §13 风险行）：
    # 真机只有 Windows，而 node:sqlite 可用性、长路径、CRLF、路径含空格
    # 全是只在 Windows 上才发作的问题。Ubuntu 同时跑，是为了让"只在我机器上行"
    # 当场变红。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 自 2026-10-19 起在数周内迁到 Ubuntu 26.04（官方计划 2026-11-19 前完成，
        # actions/runner-images#14748）；迁移期间同一标签可能解析到 24.04 或 26.04，
        # 想确定性地测新镜像就临时加一格 ubuntu-26.04。
        os: [windows-latest, ubuntu-latest]
        node: ['22.19', '24']

    steps:
      # 两个 action 钉到 Node 24 运行时的版本（v4 跑在 Node 20 上，GitHub 已弃用）。用完整提交哈希钉住，
      # 行尾写版本号；核对：gh api repos/actions/checkout/commits/v7.0.1 --jq .sha（setup-node 同理）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 必须在 setup-node 之前：cache: pnpm 要先能找到 pnpm。
      # 版本由 package.json 的 packageManager 字段决定（pnpm@11.7.0），corepack 照办。
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile：锁文件与 package.json 对不上就直接失败，不许 CI 自作主张
      # 改依赖树。这是"整套精确钉"在 CI 侧的落点（PLAN §6.3）。
      - run: pnpm install --frozen-lockfile
      # `pnpm build`（根的 `tsc -b`），**不是** `pnpm -r build`：`-r` 默认不含工作区根，
      # 而 build 脚本只有根有 ⇒ 那条命令必然 `ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT` 退出 1。
      # 本仓是 TS project references 的一棵树，本来也该由根一次 `tsc -b` 全建。
      - run: pnpm build

      # 只跑 unit + contract。integration 要真 stmsim，由下面的 `integration` job 单独跑（台账 B11）。
      # 本地跑全量：设好 STMSIM_PYTHON / STMSIM_ROOT 后 `pnpm test`。
      - run: pnpm test --project unit --project contract

      # 导出工具的单测（tools/spec-export/tests/）：只用标准库和 git，不需要参考仓、NumPy 或 SciPy。
      # 真正的重导要私有参考仓，不在 CI 里跑。
      # 按完整提交哈希钉住，行尾写版本号；核对：gh api repos/actions/setup-python/commits/v7.1.0 --jq .sha
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/spec-export/tests -v

  integration:
    # 对着真 stmsim 跑 integration 项目（台账 B11）。与 build 并行，不设 needs；只跑 ubuntu 一格，
    # 标签与上面矩阵里的 ubuntu-latest 相同，随它一起迁到 26.04（两个镜像上都有 Python 3.13）。
    # 不是必需检查，也没有任何失败豁免：红了就是红了。
    #
    # STM-Bench 钉在 STM_BENCH_SHA 这一个完整提交；三个 Python 库钉成该提交 requirements.txt
    # 括号里「上次跑过的版本」，免得数值漂移被误当成本仓的回归。怎么升钉见
    # docs/DEVELOPMENT.md「CI 里的 integration job」。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      STM_BENCH_SHA: cfd042949df6e436bdff944ab981935f43729e35
    steps:
      # 三个 action 的钉法同 build job。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 必须在主仓检出之后：主仓的检出会清理工作区，放在后面会把 stm-bench/ 清掉。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HamsterPark/STM-Bench
          ref: ${{ env.STM_BENCH_SHA }}
          path: stm-bench
          persist-credentials: false
      - name: 核对 STM-Bench 提交
        run: test "$(git -C stm-bench rev-parse HEAD)" = "$STM_BENCH_SHA"

      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: 安装 stmsim 的依赖（精确版本）
        run: |
          python -m pip install numpy==2.4.4 scipy==1.17.1 pyyaml==6.0.3
          python -c "import sys, numpy, scipy, yaml; print(sys.version.split()[0], numpy.__version__, scipy.__version__, yaml.__version__)"
      - run: pnpm install --frozen-lockfile

      # 不需要先 pnpm build：vitest 把工作区包别名到各自的 src（vitest.config.ts）。
      # 缺 STMSIM_PYTHON / STMSIM_ROOT 时 globalSetup 直接抛错，不会静默跳过。
      - name: integration
        env:
          STMSIM_PYTHON: ${{ steps.py.outputs.python-path }}
          STMSIM_ROOT: ${{ github.workspace }}/stm-bench
        run: pnpm test --project integration
