# profiles/mast-sim —— 对着模拟器跑的 profile。
#
# 分工（PLAN §6.1）：**bundle 的 patch 放与 profile 无关的行**（`mast-hello` 等），
# **profile 的 patch 放「接哪台仪器」**——这正是 sim / offline / rig 三者唯一的区别。
# 真机那份 `profiles/mast-rig` 在 Phase 8 之前不存在于本仓：真机 0 次是仓库结构，不是纪律。
#
# 装法：拷到 `$DSH_HOME/profiles/mast-sim/cordis.patch.yml`，或启动时 `--patch <本文件>`。
# 配置树的层叠次序是 空根 → 各 bundle 的 patch → profile 的 patch → `$DSH_HOME` → `--patch`。
#
# ⚠️ **profile 的 bundles 必须包含 `@deepseek-ai/dsh-web-app`**：
#
#     "dsh": { "profile": { "bundles": [
#       "@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-spm"
#     ] } }
#
# `dsh plugin --profile mast-sim add <bundle>` 建出来的新 profile **只有 `dsh-base`**，
# 而 `webServer` 服务是 `dsh-web-app` 提供的 ⇒ 少了它，`mast-ui-host` 那一行的
# `inject` 不满足，**SSE hub 整个不装载，而且不报错**（Cordis 静默不装）。
# 2026-09-10 实测撞到：`--dump-config` 里我们的行明明在，但树里根本没有 `webserver`。
# 这正是「inject 是装载依赖」的另一面——它保护你，也会安静地不装。
- insert:
    # 装上它就会 spawn 一份 stmsim，并提供 `simulated: true` 的 `ctx.instrument`；
    # 卸载时 `ctx.effect` 的回滚把进程带走。
    - id: mast-instrument-stmsim
      name: dsh-spm/instrument-stmsim
      config:
        # 与真机的 6501–6504 岔开一万。撞上的代价是「以为在打模拟器，其实在打真机」。
        ports: [16501, 16502, 16503, 16504]
        profile: polar-spm
        material: Au(111)
        # 起手就在隧道状态，否则读到的电流没有意义
        approached: true
# 解释器与 STM-Bench 路径**不写在这里**：那是每台机器各不相同的东西，写进仓库就是
# 一份注定过期的配置。给 `STMSIM_PYTHON` / `STMSIM_ROOT` 两个环境变量即可，没给时
# 插件会报一句说清怎么配的话，而不是一个语焉不详的 spawn 失败。
