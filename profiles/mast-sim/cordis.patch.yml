# profiles/mast-sim —— 对着模拟器跑的 profile。
#
# 分工（PLAN §6.1）：**bundle 的 patch 放与 profile 无关的行**（`mast-hello` 等），
# **profile 的 patch 放「接哪台仪器」**——这正是 sim / offline / rig 三者唯一的区别。
# 真机那份 `profiles/mast-rig` 在 Phase 8 之前不存在于本仓：真机 0 次是仓库结构，不是纪律。
#
# 装法：拷到 `$DSH_HOME/profiles/mast-sim/cordis.patch.yml`，或启动时 `--patch <本文件>`。
# 配置树的层叠次序是 空根 → 各 bundle 的 patch → profile 的 patch → `$DSH_HOME` → `--patch`。
#
# ⚠️ **profile 的 bundles 必须包含 `@deepseek-ai/dsh-web-app`**：
#
#     "dsh": { "profile": { "bundles": [
#       "@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-spm"
#     ] } }
#
# `dsh plugin --profile mast-sim add <bundle>` 建出来的新 profile **只有 `dsh-base`**，
# 而 `webServer` 服务是 `dsh-web-app` 提供的 ⇒ 少了它，`mast-ui-host` 那一行的
# `inject` 不满足。
#
# **失败方式随 dsh 版本变过**（这一段原先写的是「Cordis 静默不装、不报错」，09-13 在 0.1.5 上更正过一次，
# 0.2.x 上又变了）：
#   - 0.1.5-rc.1 / rc.2：boot 阶段直接失败并点名——
#       Error: dsh: plugin tree failed to load: dsh: 1 entry did not activate
#       dsh-spm/stm-ui: pending (waiting for service: webServer)
#   - 0.2.x：我们的行是**可选行**，等不到服务时只在 stderr 打一段警告，进程照常运行、退出码不变——
#       dsh: warning: 1 entry did not activate
#       mast-ui-host (dsh-spm/stm-ui): pending (waiting for service: webServer)
#     （依据 dsh-app-boot 的 README「Startup and reload failures」表与 activationDiagnostic 的文本；
#     尚未在本 profile 上实际启动验证。）
# 所以**启动成功不等于我们的行装上了**：启动后看 stderr 有没有 `did not activate`。
# 配置树里有一行，同样不等于它装载成功了（`--dump-config` 不启动任何插件）。
#
# 会话日志上传缺省开启（dsh 0.1.5 缺省关闭，0.1.6-alpha.1 起改为开启）：走官方 DeepSeek API 的请求会附带
# 会话日志增量，其中含工具结果，也就是仪器读数。`DSH_TELEMETRY_DISABLED` 管不到它（它只管 OTel 遥测那一行）。
# 本 profile 默认关掉。要开：作为 profile 补丁安装时，可在 Web 设置里打开开关；用 `--patch` 叠加时叠加层优先，
# Web 开关写不进去，改动或删掉下面这一行。关闭后再开启会补传积压的会话日志，开之前想清楚。
- id: session-log-deepseek
  config:
    enabled: false
#
# 反馈遥测：Web 界面里的评分、备注、撤回和 `/feedback`（含反馈对话框）会让 `session-telemetry-otel`
# （缺省 `FEEDBACK_ONLY`）把整段会话前缀交给 OTel 导出，其中含工具结果，也就是仪器读数。
# 本 profile 默认关掉这一行；关掉后反馈照常记进本地会话日志，只是不再外发。
# 要开：删掉下面这一行，或在更靠后的补丁层（`$DSH_HOME/cordis.patch.yml`、`--patch`）写
# `- id: session-telemetry-otel` 加 `disabled: false`。启动时设非空的 `DSH_TELEMETRY_DISABLED` 也能关这一行，
# 但环境变量不在本文件里，漏设就会外发，所以这里不依赖它。
- id: session-telemetry-otel
  disabled: true
- insert:
    # 装上它就会 spawn 一份 stmsim，并提供 `simulated: true` 的 `ctx.instrument`；
    # 卸载时 `ctx.effect` 的回滚把进程带走。
    - id: mast-instrument-stmsim
      name: dsh-spm/instrument-stmsim
      config:
        # 与真机的 6501–6504 岔开一万。撞上的代价是「以为在打模拟器，其实在打真机」。
        ports: [16501, 16502, 16503, 16504]
        profile: reference-stm
        material: Au(111)
        # 起手就在隧道状态，否则读到的电流没有意义
        approached: true
# 解释器与 STM-Bench 路径**不写在这里**：那是每台机器各不相同的东西，写进仓库就是
# 一份注定过期的配置。给 `STMSIM_PYTHON` / `STMSIM_ROOT` 两个环境变量即可，没给时
# 插件会报一句说清怎么配的话，而不是一个语焉不详的 spawn 失败。
