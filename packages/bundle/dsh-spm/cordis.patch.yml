# dsh-spm 的 bundle patch：以一次 insert 叠在 profile 已有的组合树之上。
#
# **只 insert，不改 dsh-base 的行**（PLAN §6.3）。patch 是按 id 整行替换 config、
# 不做深合并的，所以覆盖别人的行必须把原有的键抄全——抄漏一个就是静默改默认值。
# 真要覆盖时（默认模型行、approval policy 等）再单独一行一行来。
#
# id 一律加 `mast-` 前缀。这不是命名洁癖：0.1.3-alpha.2 把第三方 `file-upload`
# 插件并进了 base bundle，加载器又把重复 id 从 lint 警告改成致命错误，装了同名
# 插件的 profile 直接起不来（上游 Discussions #5881）。前缀让我们不会撞上 dsh
# 将来收编的任何行。
- insert:
    - id: mast-hello
      name: dsh-spm
    # 1 Hz 仪器状态缓存 + 实时状态提示块 + stm_get_state 工具。
    # **归 bundle 而不归 profile**：sim / offline / rig 都要它，
    # 「接哪台仪器」才是 profile 的事。`inject` 逐行写全（PLAN §6.1）——
    # 少了它这一行会在没有仪器服务时装载失败，而不是干脆不装载。
    - id: mast-instrument-state
      name: dsh-spm/instrument-state
      inject: ['instrument', 'systemPrompt', 'tools']
    # 针尖看门狗 + 急停。同样归 bundle：**只在真机上才生效的安全件，等于在模拟器上
    # 从来没被验过**。sim 上照样武装，只是那里退的是假针。
    - id: mast-watchdog
      name: dsh-spm/watchdog
      inject: ['instrument', 'instrumentState', 'commands']
    # /mast/events SSE hub（宿主面）。仪器实时状态的唯一出口（决策 D7）：
    # 1 Hz × 10 小时 = 36000 事件/会话，投进 session log 会把回放拖垮；
    # 而且仪器是一台、会话是 N 个——没有会话的时候状态也在变。
    - id: mast-ui-host
      name: dsh-spm/stm-ui
      inject: ['webServer', 'instrumentState', 'stmWatchdog']
